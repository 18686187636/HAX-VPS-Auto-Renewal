name: HAX Auto Renew

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils wget net-tools jq firefox ffmpeg curl
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruyiPage --upgrade
          python -m ruyipage install

      - name: Verify ruyipage
        run: python -c "import ruyipage; print(ruyipage.__version__)"

      - name: Configure sing-box proxy
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          # 想升级 sing-box 改这里即可
          SING_BOX_VERSION: "1.10.7"
        run: |
          set -e

          if [ -z "$NODE_LINK" ]; then
            echo "⚠️ NODE_LINK 未配置，跳过 sing-box 代理"
            exit 0
          fi

          # ---------- 1. 下载 sing-box ----------
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64)  SB_ARCH="amd64" ;;
            aarch64|arm64) SB_ARCH="arm64" ;;
            *) echo "❌ 不支持的架构: $ARCH"; exit 1 ;;
          esac

          PKG="sing-box-${SING_BOX_VERSION}-linux-${SB_ARCH}"
          URL="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${PKG}.tar.gz"

          echo "⬇️ 下载 sing-box: $URL"

          download_ok=0
          # 直链 + 三个镜像依次尝试
          for PREFIX in "" "https://ghfast.top/" "https://ghproxy.net/" "https://gh-proxy.com/"; do
            echo "  尝试: ${PREFIX}${URL}"
            if curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 180 \
                 -o sing-box.tar.gz "${PREFIX}${URL}"; then
              if file sing-box.tar.gz | grep -q 'gzip compressed data'; then
                echo "  ✅ 下载成功 (${PREFIX:-direct})"
                download_ok=1
                break
              else
                echo "  ⚠️ 文件不是 gzip，继续尝试下一个源"
                rm -f sing-box.tar.gz
              fi
            fi
          done

          if [ "$download_ok" != "1" ]; then
            echo "❌ sing-box 所有下载源均失败"
            exit 1
          fi

          tar -xzf sing-box.tar.gz
          SING_BOX_DIR=$(find . -maxdepth 1 -type d -name "sing-box-*" | head -1)
          if [ -z "$SING_BOX_DIR" ]; then
            echo "❌ 解压失败"
            ls -la
            exit 1
          fi
          sudo mv "$SING_BOX_DIR/sing-box" /usr/local/bin/
          sudo chmod +x /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz "$SING_BOX_DIR"
          sing-box version

          # ---------- 2. 生成 sing-box 配置 ----------
          echo "📝 解析 vless 链接并生成配置..."
          python3 << 'PYEOF'
          import json, sys, os, re
          from urllib.parse import urlparse, parse_qs

          link = os.environ.get('NODE_LINK', '')
          if not link:
              sys.exit(0)

          parsed = urlparse(link)
          if parsed.scheme != 'vless':
              print(f"⚠️ 不支持的协议: {parsed.scheme}，跳过")
              sys.exit(0)

          netloc = parsed.netloc
          if '@' in netloc:
              uuid, host_port = netloc.split('@', 1)
          else:
              uuid, host_port = '', netloc

          host = ''
          port = '443'
          bracket_match = re.match(r'^\[([^\]]+)\](?::(\d+))?$', host_port)
          if bracket_match:
              host = bracket_match.group(1)
              if bracket_match.group(2):
                  port = bracket_match.group(2)
          else:
              if host_port.count(':') > 1:
                  host = host_port
              elif ':' in host_port:
                  host, port = host_port.split(':', 1)
              else:
                  host = host_port

          if not host:
              print(f"❌ 无法解析 host: {host_port}")
              sys.exit(1)

          params = parse_qs(parsed.query)
          sni = params.get('sni', [''])[0] or host
          fp = params.get('fp', [''])[0] or 'chrome'
          flow = params.get('flow', [''])[0] or 'xtls-rprx-vision'
          type_ = params.get('type', ['tcp'])[0]
          security = params.get('security', [''])[0]
          path = params.get('path', [''])[0]
          host_header = params.get('host', [''])[0] or host

          outbound = {
              "type": "vless",
              "tag": "vless-out",
              "server": host,
              "server_port": int(port),
              "uuid": uuid,
              "flow": flow,
              "packet_encoding": "packetaddr",
          }

          if security.lower() != 'none':
              outbound["tls"] = {
                  "enabled": True,
                  "server_name": sni,
                  "insecure": False,
                  "utls": {"enabled": True, "fingerprint": fp}
              }

          if type_ != 'tcp':
              transport = {"type": type_}
              if type_ == 'ws':
                  transport["path"] = path or "/"
                  transport["headers"] = {"Host": host_header}
              elif type_ == 'grpc':
                  transport["service_name"] = path or ""
              outbound["transport"] = transport

          if security == 'reality':
              pbk = params.get('pbk', [''])[0]
              sid = params.get('sid', [''])[0]
              outbound['tls']['reality'] = {
                  "enabled": True,
                  "public_key": pbk,
                  "short_id": sid
              }

          config = {
              "log": {"level": "warn"},
              "inbounds": [
                  {"type": "socks", "tag": "socks-in", "listen": "127.0.0.1", "listen_port": 1080},
                  {"type": "http", "tag": "http-in", "listen": "127.0.0.1", "listen_port": 1081}
              ],
              "outbounds": [outbound],
              "route": {"rules": [{"outbound": "vless-out", "protocol": ["tcp", "udp"]}]}
          }

          with open("sing-box-config.json", "w") as f:
              json.dump(config, f, indent=2)
          print("✅ sing-box-config.json 已生成")
          PYEOF

          # ---------- 3. 启动 sing-box ----------
          if [ -f sing-box-config.json ]; then
            echo "🚀 启动 sing-box..."
            nohup sing-box -c sing-box-config.json run > sing-box.log 2>&1 &
            sleep 5
            if netstat -tuln | grep -q ':1080'; then
              echo "✅ SOCKS5 代理已启动 (127.0.0.1:1080)"
              echo "✅ HTTP  代理已启动 (127.0.0.1:1081)"
            else
              echo "❌ 代理启动失败，日志如下:"
              cat sing-box.log
              exit 1
            fi
          else
            echo "⚠️ 未生成配置文件，跳过代理启动"
          fi

      - name: Print sing-box log
        if: always()
        run: cat sing-box.log || true

      - name: Start forwarders and run renewal
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          HEADLESS: "true"
          PROXY_SERVER: ${{ secrets.NODE_LINK != '' && 'http://127.0.0.1:1081' || '' }}
        run: |
          # 启动账号1的转发器
          SESSION_STRING=${{ secrets.SESSION_STRING_1 }} \
          TARGET_BOT_TOKEN=${{ secrets.BOT_TOKEN_1 }} \
          TARGET_CHAT_ID=${{ secrets.CHAT_ID_1 }} \
          python3 forwarder.py &
          PID1=$!

          # 启动账号2的转发器
          SESSION_STRING=${{ secrets.SESSION_STRING_2 }} \
          TARGET_BOT_TOKEN=${{ secrets.BOT_TOKEN_2 }} \
          TARGET_CHAT_ID=${{ secrets.CHAT_ID_2 }} \
          python3 forwarder.py &
          PID2=$!

          # 启动账号3的转发器
          SESSION_STRING=${{ secrets.SESSION_STRING_3 }} \
          TARGET_BOT_TOKEN=${{ secrets.BOT_TOKEN_3 }} \
          TARGET_CHAT_ID=${{ secrets.CHAT_ID_3 }} \
          python3 forwarder.py &
          PID3=$!

          # --- 新增 账号4 ~ 6 ---
          SESSION_STRING=${{ secrets.SESSION_STRING_4 }} \
          TARGET_BOT_TOKEN=${{ secrets.BOT_TOKEN_4 }} \
          TARGET_CHAT_ID=${{ secrets.CHAT_ID_4 }} \
          python3 forwarder.py &
          PID4=$!

          SESSION_STRING=${{ secrets.SESSION_STRING_5 }} \
          TARGET_BOT_TOKEN=${{ secrets.BOT_TOKEN_5 }} \
          TARGET_CHAT_ID=${{ secrets.CHAT_ID_5 }} \
          python3 forwarder.py &
          PID5=$!

          SESSION_STRING=${{ secrets.SESSION_STRING_6 }} \
          TARGET_BOT_TOKEN=${{ secrets.BOT_TOKEN_6 }} \
          TARGET_CHAT_ID=${{ secrets.CHAT_ID_6 }} \
          python3 forwarder.py &
          PID6=$!

          echo "🚀 六个转发器已启动 (PIDs: $PID1, $PID2, $PID3, $PID4, $PID5, $PID6)"
          sleep 8  # 等待转发器初始化

          # 运行续期脚本
          xvfb-run --auto-servernum python3 renew.py

          # 清理所有转发器进程
          kill $PID1 $PID2 $PID3 $PID4 $PID5 $PID6 2>/dev/null || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
            *.log
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f firefox || true
          pkill -f geckodriver || true
          pkill -f Xvfb || true
