name: HAX Auto Renew

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Start sing-box proxy (if NODE_LINK provided)
        if: env.NODE_LINK != ''
        run: |
          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.13.16/sing-box-1.13.16-linux-amd64-glibc.tar.gz
          tar -xzf sing-box-*.tar.gz
          cd sing-box-*-linux-amd64-glibc
          echo "$NODE_LINK" > node.txt
          ./sing-box generate config -o config.json --node "$NODE_LINK"
          ./sing-box run -c config.json &
          sleep 5
          echo "✅ 代理已启动"
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}

      - name: Run renewal
        run: xvfb-run --auto-servernum python renew.py
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          HEADLESS: "true"
