name: HAX Auto Renew

on:
  schedule:
    - cron: '0 0 * * *'          # 每天 UTC 00:00（北京时间 08:00）
  workflow_dispatch:             # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Download & start sing-box proxy
        if: env.IS_PROXY == 'true'
        run: |
          # 下载 sing-box（若已缓存可跳过）
          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.13.16/sing-box-1.13.16-linux-amd64-glibc.tar.gz
          tar -xzf sing-box-1.13.16-linux-amd64-glibc.tar.gz
          cd sing-box-1.13.16-linux-amd64-glibc
          # 解析 vless 链接（从环境变量 NODE_LINK 读取）
          echo "$NODE_LINK" > node.txt
          # 使用 sing-box 生成配置（此处需按实际链接格式调整）
          ./sing-box generate config -o config.json --node "$NODE_LINK"
          # 启动代理（监听 127.0.0.1:1080）
          ./sing-box run -c config.json &
          sleep 5
          echo "✅ 代理启动 (127.0.0.1:1080)"
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          IS_PROXY: ${{ secrets.IS_PROXY }}

      - name: Run renewal script
        run: |
          xvfb-run --auto-servernum python renew.py
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}      # 若全局统一，也可在账号内单独配置
          IS_PROXY: ${{ secrets.IS_PROXY }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          HEADLESS: "true"
          # 可选：音频备用 API
          AUDIO_API_URL: ${{ secrets.AUDIO_API_URL }}
